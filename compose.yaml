name: autokeep-local
services:
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
    restart: unless-stopped
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: autokeep
      MYSQL_USER: autokeep
      MYSQL_PASSWORD: ${DB_PASSWORD:?Execute npm run dev para gerar o .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute npm run dev para gerar o .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  app:
    build: .
    init: true
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
      PORT: 8080
      APP_ORIGIN: http://localhost:8080
      AUTH_MODE: local
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: autokeep
      DB_USER: autokeep
      DB_PASSWORD: ${DB_PASSWORD:?Execute npm run dev}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Execute npm run dev}
      SEED_DEMO: 'true'
      SMTP_HOST: mail
      SMTP_PORT: 1025
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./db:/app/db
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
