<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202a35" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('autokeep-theme');
        } catch {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#131820' : '#202a35';
      })();
    </script>
    <meta
      name="description"
      content="Cuide do seu carro e da sua frota. A próxima manutenção, sempre no radar."
    />
    <link rel="icon" type="image/svg+xml" href="/autokeep-mark.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AutoKeep — manutenção em dia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
