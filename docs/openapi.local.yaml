openapi: 3.1.0
info:
  title: AutoKeep — garagem pessoal
  version: 0.2.0
  description: |
    API compartilhada pelo Docker e AWS Lambda. Sessão por cookie HttpOnly.
    Escritas exigem Origin igual a APP_ORIGIN e Content-Type application/json,
    inclusive DELETE. Datas ISO 8601 com offset; datas futuras são rejeitadas.
    organizationId identifica a garagem pessoal legada e não uma frota.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: API e acesso ao banco disponíveis }
  /auth/providers:
    get:
      security: []
      responses:
        '200':
          description: Provedores habilitados neste servidor
          content:
            application/json:
              schema:
                type: object
                required: [google, development, password]
                properties:
                  google: { type: boolean }
                  development: { type: boolean }
                  password: { type: boolean, const: false }
  /auth/dev-login:
    post:
      security: []
      description: Disponível somente com NODE_ENV=development e DEV_LOGIN_ENABLED=true, fora do modo Google.
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: Sessão da conta pessoal de teste criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/google/start:
    post:
      security: []
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200':
          description: URL de autorização Google e cookie temporário HttpOnly
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/google/callback:
    get:
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '303':
          {
            description: Redireciona à aplicação; sucesso abre sessão,
            falha informa código googleError,
          }
  /auth/logout:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pushEndpoint: { type: string, format: uri }
      responses:
        '204': { description: Sessão revogada }
  /session:
    get:
      responses:
        '200':
          description: Conta e garagem pessoal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /me/organizations:
    get:
      responses:
        '200': { description: Objeto organizations com associações pessoais do proprietário }
  /organizations/{organizationId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      responses:
        '200': { description: Objeto vehicles com veículos ativos da garagem }
        '403': { $ref: '#/components/responses/Error' }
  /organizations/{organizationId}/vehicles:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVehicle' }
      responses:
        '201': { description: Objeto id do veículo criado }
        '400': { $ref: '#/components/responses/Error' }
  /organizations/{organizationId}/vehicles/{vehicleId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      responses:
        '200': { description: Objeto vehicle com dados, leituras, projeção e status de manutenção }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '204': { description: Veículo arquivado; histórico preservado }
        '404': { $ref: '#/components/responses/Error' }
  /organizations/{organizationId}/vehicles/{vehicleId}/odometer:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/VehicleId' }
    post:
      description: Rejeita quilometragem regressiva e data igual ou anterior à última leitura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [odometer, measuredAt, source]
              properties:
                odometer: { $ref: '#/components/schemas/Odometer' }
                measuredAt: { type: string, format: date-time }
                source: { type: string, enum: [MANUAL] }
      responses:
        '201': { description: Leitura registrada; objeto ok }
        '400': { $ref: '#/components/responses/Error' }
  /organizations/{organizationId}/vehicles/{vehicleId}/oil-changes:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/VehicleId' }
    post:
      description: Troca posterior à última manutenção e consistente com as leituras registradas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [odometer, changedAt, oilType]
              properties:
                odometer: { $ref: '#/components/schemas/Odometer' }
                changedAt: { type: string, format: date-time }
                oilType: { $ref: '#/components/schemas/OilType' }
      responses:
        '201': { description: Troca registrada; objeto ok }
        '400': { $ref: '#/components/responses/Error' }
  /organizations/{organizationId}/vehicles/{vehicleId}/history:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      responses:
        '200': { description: Objetos readings e oilChanges com histórico do veículo }
  /organizations/{organizationId}/audit:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      responses:
        '200': { description: Objeto events com até 100 eventos críticos da garagem }
  /organizations/{organizationId}/notifications:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      responses:
        '200':
          { description: Objeto notifications; avalia manutenção e persiste avisos deduplicados }
  /organizations/{organizationId}/notifications/read:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    post:
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { description: Avisos do proprietário marcados como lidos; objeto ok }
  /push/config:
    get:
      responses:
        '200': { description: publicKey VAPID ou null quando desabilitado }
  /push/subscription:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '204': { description: Assinatura registrada para a conta }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '204': { description: Assinatura própria removida }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: autokeep_session
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
  responses:
    Error:
      description: Erro com code, message e errorId; 400 entrada inválida, 401 sem sessão, 403 sem acesso, 404 inexistente, 415 formato inválido.
      content:
        application/json:
          schema:
            type: object
            required: [code, message, errorId]
            properties:
              code: { type: string }
              message: { type: string }
              errorId: { type: string, format: uuid }
  schemas:
    Odometer: { type: number, minimum: 0, maximum: 9999999.9, multipleOf: 0.1 }
    OilType: { type: string, enum: [MINERAL, SEMI_SYNTHETIC, SYNTHETIC] }
    CreateVehicle:
      type: object
      additionalProperties: false
      required:
        [
          name,
          plate,
          year,
          oilType,
          trackingMode,
          currentOdometer,
          lastOilChangeKm,
          lastOilChangeDate,
        ]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        plate: { type: string, pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$' }
        year: { type: integer, minimum: 1950, description: Até o ano atual mais um }
        oilType: { $ref: '#/components/schemas/OilType' }
        trackingMode: { type: string, enum: [MANUAL] }
        currentOdometer: { $ref: '#/components/schemas/Odometer' }
        lastOilChangeKm: { $ref: '#/components/schemas/Odometer' }
        lastOilChangeDate: { type: string, format: date-time }
    Session:
      type: object
      required: [user, memberships]
      properties:
        user:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
        memberships:
          type: array
          items:
            type: object
            required: [organizationId, companyName, kind, role]
            properties:
              organizationId: { type: string, format: uuid }
              companyName: { type: string }
              kind: { type: string, const: PERSONAL }
              role:
                {
                  type: string,
                  const: ADMIN,
                  description: Identificador legado interno de proprietário,
                }
